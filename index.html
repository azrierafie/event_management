<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Event Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-title {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInDown 1s ease;
    }
    
    .page-title h1 {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(45deg, #4361ee, #3a0ca3, #7209b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    
    .page-title p {
      color: #6c757d;
      font-size: 1.1rem;
      font-weight: 400;
    }
    
    .login-card {
      animation: fadeInUp 1s ease;
    }
    
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @media (max-width: 768px) {
      .page-title h1 {
        font-size: 2rem;
      }
      
      .page-title p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body class="login-page">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="d-flex flex-column align-items-center">
    <!-- Page Title -->
    <div class="page-title">
      <h1>
        <i class="bi bi-calendar-event"></i> 
        Personal Event Manager
      </h1>
      <p>Organize your events with ease</p>
    </div>
    
    <!-- Login Card -->
    <div class="card p-4 shadow login-card" style="width: 350px; margin: 0 auto;">
      <h4 class="text-center mb-3">🔐 Login</h4>
      <form onsubmit="return login()">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">
          Demo: admin@example.com / admin123
        </small>
      </div>
    </div>
  </div>
</div>

<script src="jsstorage.js"></script>
<script src="jsscript.js"></script>
<script src="jsdarkmode.js"></script>
</body>
</html>
